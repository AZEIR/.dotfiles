# -----------------------------------------------------------------------------
# --- GENERAL SETTINGS ---
# -----------------------------------------------------------------------------

# Fix escape-time delay (essential for Vim/Neovim responsiveness)
set -sg escape-time 10

# Enable 256-color support
set -g default-terminal "tmux-256color"

# Enable True Color (RGB) support
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable focus events for terminals that support them (useful for Neovim)
set-option -g focus-events on 


# -----------------------------------------------------------------------------
# --- INTERACTION ---
# -----------------------------------------------------------------------------

# Enable mouse support (resizing panes, clicking tabs, scrolling)
set -g mouse on

# -----------------------------------------------------------------------------
# --- VISUALS & PANE BORDERS ---
# -----------------------------------------------------------------------------

# Pane border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Command line / Message styling
set -g message-style "bg=#1e1e2e,fg=#fab387,bold"


# -----------------------------------------------------------------------------
# --- STATUS BAR ---
# -----------------------------------------------------------------------------

# General status bar settings
set -g status-justify left
set -g status-interval 2
set -g status-style "bg=default,fg=#5e6791" # Transparent background

# Status Left: Session name with a powerline-style arrow
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[bg=default,fg=#89b4fa] "
set -g status-left-length 20

# Status Right: Simple clock
set -g status-right "#[fg=#5e6791]#[fg=#1e1e2e,bg=#5e6791] %H:%M "

# Window Status (Inactive): How the tabs look
setw -g window-status-format " #[fg=#5e6791]#I:#W "

# Window Status (Active): Highlight the current tab with orange
setw -g window-status-current-format "#[fg=#fab387,bold] #I:#W*"

# -----------------------------------------------------------------------------
# --- COPY MODE CONFIGURATION (Vi Style + Clipboard Fix) ---
# -----------------------------------------------------------------------------

# Use Vim keybindings in copy mode
set-window-option -g mode-keys vi

# Start selection with 'v' (Like Vim visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy with 'y' and send it to system clipboard (Requires xclip)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"

# Fix mouse drag: Copy to clipboard and clear selection instead of breaking
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se clipboard -i"

# -----------------------------------------------------------------------------
# --- Key bindings --- 
# -----------------------------------------------------------------------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
